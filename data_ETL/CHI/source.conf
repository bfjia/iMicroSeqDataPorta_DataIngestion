# CHI: Centre for Health Informatics (University of Calgary), Alberta wastewater
# data: influenza A/B, RSV and COVID. Read by run_initial_upload.sh. Plain bash
# assignments. See data_ETL/README.md.

SOURCE_ID="CHI"                            # names this source's run folders and messages
UPLOAD_CSV="curated/CHI.csv"               # written by etl.sh, relative to this folder
MAX_NEW=2000                               # stop if more new records than this (see pipeline.conf)
ENABLED=0                                  # 0 = run_weekly_update.sh skips this source (not tested on a portal yet)

# Per portal. The organization is the account's Ego scope WW-<ORG>.WRITE minus
# "WW-", and each portal names it differently. Check: ./list_sources.sh --check
# TODO: not created on either portal yet (2026-11-04). Until these are set, any
# run for CHI stops with "must set ORGANIZATION_DEV/PROD".
ORGANIZATION_DEV=""                        # dev
ORGANIZATION_PROD=""                       # prod
CATEGORY_DEV="imicroseq_wastewater"        # dev category (id 3)
CATEGORY_PROD="imicroseq_environmental"    # prod category (id 1); same dictionary as dev

# MAX_NEW and ENABLED can also be set per portal, e.g. ENABLED_PROD=0.
