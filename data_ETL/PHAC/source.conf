# PHAC National Wastewater Monitoring of Pathogens (NWMP).
# Read by run_initial_upload.sh. Plain bash assignments. See data_ETL/README.md.

SOURCE_ID="PHAC-NWMP"                      # names this source's run folders and messages
UPLOAD_CSV="curated/PHAC-NWMP.dedup.csv"   # written by etl.sh, relative to this folder
MAX_NEW=2000                               # stop if more new records than this (see pipeline.conf)
ENABLED=1                                  # 0 = run_weekly_update.sh skips this source

# Per portal. The organization is the account's Ego scope WW-<ORG>.WRITE minus
# "WW-", and each portal names it differently. Check: ./list_sources.sh --check
ORGANIZATION_DEV="PHAC-AUTOINGEST"         # dev: holds the PHAC records uploaded since 2026-10-30
ORGANIZATION_PROD="PHAC-NWMP"              # prod
CATEGORY_DEV="imicroseq_wastewater"        # dev category (id 3)
CATEGORY_PROD="imicroseq_environmental"    # prod category (id 1); same dictionary as dev

# MAX_NEW and ENABLED can also be set per portal, e.g. ENABLED_PROD=0.
