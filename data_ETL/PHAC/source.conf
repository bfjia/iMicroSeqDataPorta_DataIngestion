# PHAC National Wastewater Monitoring of Pathogens (NWMP).
# Read by run_source.sh. Plain bash assignments. See data_ETL/README.md.

SOURCE_ID="PHAC-NWMP"                      # names this source's run folders and messages
ORGANIZATION="PHAC-AUTOINGEST"             # portal org = Ego scope WW-PHAC-AUTOINGEST.WRITE minus "WW-" (dev and prod)
CATEGORY_DEV="imicroseq_wastewater"        # portal category on dev (id 3)
CATEGORY_PROD="imicroseq_environmental"    # portal category on prod (id 1); same dictionary as dev
UPLOAD_CSV="curated/PHAC-NWMP.dedup.csv"   # written by etl.sh, relative to this folder
MAX_NEW=2000                               # stop if more new records than this (see pipeline.conf)
ENABLED=1                                  # 0 = run_weekly.sh skips this source
# Any of ORGANIZATION, CATEGORY, MAX_NEW, ENABLED can be set per portal with a
# _DEV or _PROD suffix, which wins over the plain key on that portal.
