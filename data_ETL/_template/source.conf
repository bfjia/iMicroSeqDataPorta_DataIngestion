# Per portal. The organization is the account's Ego scope WW-<ORG>.WRITE minus
# "WW-", and each portal names it differently. Ask the portal admins to grant
# WRITE on both, then check with: ./list_sources.sh --check
ORGANIZATION_DEV="TODO-DEV-ORG"            # organization on dev
ORGANIZATION_PROD="TODO-PROD-ORG"          # organization on prod
CATEGORY_DEV="imicroseq_wastewater"        # dev category
CATEGORY_PROD="imicroseq_environmental"    # prod category

# MAX_NEW and ENABLED can also be set per portal, e.g. ENABLED_PROD=0 keeps a
# new source on dev only until it's ready for prod.
