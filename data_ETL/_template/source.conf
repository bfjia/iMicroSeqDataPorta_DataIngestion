SOURCE_ID="TODO-SOURCE-ID"                 # short unique name, e.g. "BCCDC-WW"; used in run folders and messages
UPLOAD_CSV="curated/TODO.csv"              # the file etl.sh writes, relative to this folder
MAX_NEW=2000                               # stop if a run finds more new records than this
