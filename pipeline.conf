# Pipeline-wide settings, read by run_source.sh and run_weekly.sh.
# Plain bash variable assignments: KEY="value", no spaces around "=".

# DEV ONLY. Upload only records whose collection week starts on or after this
# date (YYYY-MM-DD), to keep the dev portal small. Every source is filtered
# the same way, right after its ETL. Set to "" for no cutoff (all history).
DEV_MIN_START_DATE="2026-08-01"

# Safety limit for sources whose source.conf does not set MAX_NEW: a run that
# finds more new records than this stops without uploading, unless it is
# re-run with --force. A normal PHAC week brings ~150-300.
DEFAULT_MAX_NEW=2000
