# Pipeline-wide settings, read by run_initial_upload.sh, run_weekly_update.sh and
# close_submission.sh. Plain bash variable assignments: KEY="value", no spaces
# around "=".

# Which portal runs use when no --env is given: "dev" (dev.virusseq-dataportal.ca)
# or "prod" (imicroseq-dataportal.ca). The scheduled run uses this too.
PORTAL_ENV="dev"

# Date window per portal. Upload only records whose collection week starts on
# or after this date (YYYY-MM-DD). Every source is filtered the same way, right
# after its ETL. "" = no cutoff (all history).
DEV_MIN_START_DATE="2026-09-01"    # keeps the dev portal small
PROD_MIN_START_DATE=""             # prod gets the full history

# Safety limit for sources whose source.conf does not set MAX_NEW: a run that
# finds more new records than this stops without uploading, unless it is
# re-run with --force. A normal PHAC week brings ~150-300.
DEFAULT_MAX_NEW=2500

# Edits: records that are already published but that the source has revised
# since. 1 = each run sends them as edits, in the same submission as the new
# records; 0 = only report them. A source can opt out with EDIT_REVISED=0 in its
# source.conf (or EDIT_REVISED_DEV / EDIT_REVISED_PROD).
DEFAULT_EDIT_REVISED=1

# Safety limit for edits: a run that finds more revised records than this stops
# with an error and uploads nothing. A normal PHAC week revises ~70. A source
# can set its own MAX_EDITS. ./run_edits.sh (a person approves) isn't limited.
DEFAULT_MAX_EDITS=2000

# First loads with run_initial_upload.sh --chunk: at most this many records per
# submission. Each chunk is confirmed by a person, and the previous one has to
# be committed on the website before the next is uploaded.
CHUNK_SIZE=10000

# Slack channel that gets msg.md after every run (dry runs never post), as a
# channel ID: in Slack, open the channel's details; the ID is at the bottom.
# The bot token is duoliauthtoken in upload_workflow/.env, and the bot must be
# in the channel (/invite @<bot name>). "" = don't post.
# C0CDQRKNWFK = #_integration_notifications (private; the bot is a member)
SLACK_CHANNEL="C0CDQRKNWFK"
